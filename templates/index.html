<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcription & Summarization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2><i data-feather="mic"></i> Audio Transcription & Summarization</h2>
                    </div>
                    <div class="card-body">
                        <form action="/process" method="post" enctype="multipart/form-data" id="uploadForm">
                            <div class="mb-3">
                                <label for="audio_file" class="form-label">Select Audio File</label>
                                <input type="file" class="form-control" id="audio_file" name="audio_file" accept=".wav,.mp3,.ogg,.m4a" required>
                                <div class="form-text">Supported formats: WAV, MP3, OGG, M4A (Max size: 16MB)</div>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <i data-feather="upload"></i> Process Audio
                                </button>
                            </div>
                        </form>
                        <div class="mt-3 d-none" id="processingMessage">
                            <div class="alert alert-info text-center">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                Processing your audio file... Please wait.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
